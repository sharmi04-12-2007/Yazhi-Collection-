<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Portal Login – Yazhi Collection Administration</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="auth-page" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;background:linear-gradient(135deg,#261129 0%,#3B1F3F 60%,#7A3455 100%)">
    <div class="auth-card" style="width:100%;max-width:420px;background:#fff;border-radius:var(--r-lg);box-shadow:0 12px 36px rgba(0,0,0,.35);padding:2.5rem 2rem;border:1px solid rgba(255,255,255,.2)">
      <div style="text-align:center;margin-bottom:2rem">
        <a href="home.html">
          <img src="images/logo.svg" alt="Yazhi Collection" style="height:44px;margin:0 auto .75rem;display:block">
        </a>
        <span class="gold-sub" style="margin-bottom:.2rem;display:block">Owner Administration Portal</span>
        <p style="color:var(--muted);font-size:.82rem">Exclusive Management Access for <strong>Sharmila M</strong></p>
      </div>

      <div class="form-group" style="margin-bottom:1.15rem">
        <label>Username</label>
        <input type="text" id="owner-username" placeholder="Username (sharmila)" autocomplete="username" style="width:100%;padding:.75rem 1rem;border:1.5px solid var(--border);border-radius:var(--r-sm)">
      </div>
      <div class="form-group" style="margin-bottom:1.15rem">
        <label>Password</label>
        <div style="position:relative">
          <input type="password" id="owner-password" placeholder="••••••••••••" style="width:100%;padding:.75rem 2.5rem .75rem 1rem;border:1.5px solid var(--border);border-radius:var(--r-sm)" autocomplete="current-password">
          <button type="button" onclick="togglePwd()" style="position:absolute;right:.85rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem">Show</button>
        </div>
      </div>

      <div id="owner-error" class="alert alert-warning" style="display:none;margin-bottom:1rem;font-size:.82rem"></div>

      <button class="btn btn-gold btn-full btn-lg" onclick="doOwnerLogin()" style="margin-top:.5rem;box-shadow:0 4px 14px rgba(201,164,92,.3)">
        Enter Owner Dashboard →
      </button>

      <div style="text-align:center;margin-top:1.5rem">
        <a href="home.html" style="font-size:.8rem;color:var(--muted);text-decoration:none">← Return to Storefront</a>
        <span style="color:var(--border);margin:0 .5rem">·</span>
        <a href="login.html" style="font-size:.8rem;color:var(--muted);text-decoration:none">Customer Login</a>
      </div>

      <div style="margin-top:1.75rem;padding:.85rem;background:var(--blush-lt);border-radius:var(--r-sm);font-size:.75rem;color:var(--plum);text-align:center;border:1px dashed var(--border)">
        <strong>Authorized Credentials</strong><br>
        Username: <code>sharmila</code> · Password: <code>yazhi@owner2024</code>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    const sess = yazhiGetSession();
    if (sess && sess.role === 'owner') window.location.href = 'owner-dashboard.html';

    function togglePwd() {
      const inp = document.getElementById('owner-password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function doOwnerLogin() {
      const username = document.getElementById('owner-username').value.trim();
      const password = document.getElementById('owner-password').value;
      const errEl = document.getElementById('owner-error');
      if (!username || !password) { errEl.style.display = ''; errEl.textContent = 'Please enter both username and password.'; return; }
      const result = yazhiOwnerLogin(username, password);
      if (result.success) {
        yazhiToast('Welcome, Sharmila M!', 'success');
        setTimeout(() => { window.location.href = 'owner-dashboard.html'; }, 500);
      } else {
        errEl.style.display = '';
        errEl.textContent = result.error;
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doOwnerLogin(); });
  </script>
</body>

</html>
