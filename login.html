<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login / Register – Yazhi Collection | Luxury Boutique</title>
  <meta name="description" content="Login or register with Yazhi Collection to order custom sarees, lehengas, and track your boutique orders.">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="auth-page" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;background:linear-gradient(135deg,rgba(59,31,63,.06),rgba(122,52,85,.06))">
    <div class="auth-card" style="width:100%;max-width:440px;background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-md);padding:2.5rem 2rem;border:1px solid var(--border)">
      <div class="auth-logo" style="text-align:center;margin-bottom:2rem">
        <a href="home.html" title="Yazhi Collection">
          <img src="images/logo.svg" alt="Yazhi Collection" style="height:44px;width:auto;margin:0 auto .75rem;display:block">
        </a>
        <span class="gold-sub" style="margin-bottom:.25rem;display:block">Luxury Women's Boutique</span>
        <p style="color:var(--muted);font-size:.85rem">Sign in to your client account or register a new one</p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs" style="display:flex;gap:.5rem;margin-bottom:1.5rem;border-bottom:1px solid var(--border)">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')" style="flex:1;padding:.75rem;font-size:.9rem;font-weight:600;background:none;border:none;border-bottom:2px solid var(--plum);cursor:pointer;color:var(--plum)">
          Login
        </button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')" style="flex:1;padding:.75rem;font-size:.9rem;font-weight:600;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted)">
          Create Account
        </button>
      </div>

      <!-- Login Form -->
      <div id="form-login">
        <div class="form-group" style="margin-bottom:1.15rem">
          <label>Email Address</label>
          <input type="email" id="login-email" placeholder="client@example.com" autocomplete="email" style="width:100%;padding:.75rem 1rem;border:1.5px solid var(--border);border-radius:var(--r-sm)">
        </div>
        <div class="form-group" style="margin-bottom:1.15rem">
          <label>Password</label>
          <div style="position:relative">
            <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password" style="width:100%;padding:.75rem 2.5rem .75rem 1rem;border:1.5px solid var(--border);border-radius:var(--r-sm)">
            <button type="button" onclick="togglePwd('login-password',this)" style="position:absolute;right:.85rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem">Show</button>
          </div>
        </div>
        <div id="login-error" class="alert alert-warning" style="display:none;margin-bottom:1rem;font-size:.82rem"></div>
        <button class="btn btn-primary btn-full btn-lg" onclick="doLogin()" style="box-shadow:0 4px 14px rgba(122,52,85,.25)">
          Sign In →
        </button>
        <div class="divider-text" style="text-align:center;margin:1.25rem 0;color:var(--muted);font-size:.8rem">or</div>
        <a href="home.html" class="btn btn-ghost btn-full" style="text-align:center;font-size:.85rem">
          Continue Browsing as Guest
        </a>
      </div>

      <!-- Register Form -->
      <div id="form-register" style="display:none">
        <div class="form-grid-2">
          <div class="form-group" style="margin-bottom:1rem">
            <label>Full Name *</label>
            <input type="text" id="reg-name" placeholder="Your full name" style="width:100%;padding:.7rem .85rem;border:1.5px solid var(--border);border-radius:var(--r-sm)">
          </div>
          <div class="form-group" style="margin-bottom:1rem">
            <label>Phone Number *</label>
            <input type="tel" id="reg-phone" placeholder="10-digit mobile" maxlength="10" style="width:100%;padding:.7rem .85rem;border:1.5px solid var(--border);border-radius:var(--r-sm)">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:1rem">
          <label>Email Address *</label>
          <input type="email" id="reg-email" placeholder="client@example.com" style="width:100%;padding:.7rem .85rem;border:1.5px solid var(--border);border-radius:var(--r-sm)">
        </div>
        <div class="form-group" style="margin-bottom:1rem">
          <label>Choose Password *</label>
          <div style="position:relative">
            <input type="password" id="reg-password" placeholder="At least 6 characters" style="width:100%;padding:.7rem 2.5rem .7rem .85rem;border:1.5px solid var(--border);border-radius:var(--r-sm)">
            <button type="button" onclick="togglePwd('reg-password',this)" style="position:absolute;right:.85rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem">Show</button>
          </div>
        </div>
        <div id="reg-error" class="alert alert-warning" style="display:none;margin-bottom:1rem;font-size:.82rem"></div>
        <div id="reg-success" class="alert alert-success" style="display:none;margin-bottom:1rem;font-size:.82rem"></div>
        <button class="btn btn-primary btn-full btn-lg" onclick="doRegister()">
          Register Account →
        </button>
        <p style="font-size:.76rem;color:var(--muted);text-align:center;margin-top:.85rem;line-height:1.4">
          By registering you unlock exclusive 50% discount code <strong>YAZHI50</strong> and track parcel timelines.
        </p>
      </div>

      <div style="text-align:center;margin-top:1.75rem;padding-top:1.25rem;border-top:1px solid var(--border)">
        <a href="owner-login.html" style="font-size:.78rem;color:var(--muted);text-decoration:none">
          Owner Portal Access →
        </a>
      </div>
    </div>
  </div>

  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    const existingSession = yazhiGetSession();
    if (existingSession && existingSession.role !== 'owner') {
      const redirect = new URLSearchParams(location.search).get('redirect') || 'home.html';
      window.location.href = redirect;
    }

    const redirectUrl = new URLSearchParams(location.search).get('redirect') || 'home.html';

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tab-login').style.borderBottomColor = isLogin ? 'var(--plum)' : 'transparent';
      document.getElementById('tab-login').style.color = isLogin ? 'var(--plum)' : 'var(--muted)';
      document.getElementById('tab-register').style.borderBottomColor = !isLogin ? 'var(--plum)' : 'transparent';
      document.getElementById('tab-register').style.color = !isLogin ? 'var(--plum)' : 'var(--muted)';
      document.getElementById('form-login').style.display = isLogin ? '' : 'none';
      document.getElementById('form-register').style.display = !isLogin ? '' : 'none';
    }

    function togglePwd(id, btn) {
      const inp = document.getElementById(id);
      const isPass = inp.type === 'password';
      inp.type = isPass ? 'text' : 'password';
      btn.textContent = isPass ? 'Hide' : 'Show';
    }

    function doLogin() {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');
      if (!email || !pass) { errEl.style.display = ''; errEl.textContent = 'Please fill in both email and password.'; return; }
      const result = yazhiLogin(email, pass);
      if (result.success) {
        yazhiToast(`Welcome back, ${result.session.name.split(' ')[0]}!`, 'success');
        setTimeout(() => { window.location.href = redirectUrl; }, 700);
      } else {
        errEl.style.display = '';
        errEl.textContent = result.error;
      }
    }

    function doRegister() {
      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-password').value;
      const errEl = document.getElementById('reg-error');
      const succEl = document.getElementById('reg-success');
      errEl.style.display = 'none';
      succEl.style.display = 'none';

      if (!name || !phone || !email || !pass) { errEl.style.display = ''; errEl.textContent = 'Please fill in all required fields.'; return; }
      if (pass.length < 6) { errEl.style.display = ''; errEl.textContent = 'Password must be at least 6 characters.'; return; }
      if (!/^\d{10}$/.test(phone)) { errEl.style.display = ''; errEl.textContent = 'Please enter a valid 10-digit phone number.'; return; }

      const result = yazhiRegister(name, email, phone, pass);
      if (result.success) {
        succEl.style.display = '';
        succEl.textContent = '✔ Account created! Logging you in...';
        setTimeout(() => { window.location.href = redirectUrl; }, 900);
      } else {
        errEl.style.display = '';
        errEl.textContent = result.error;
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (document.getElementById('form-login').style.display !== 'none') doLogin();
        else doRegister();
      }
    });
  </script>
</body>

</html>
