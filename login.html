<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register – Yazhi Collection</title>
  <meta name="description" content="Login or create an account at Yazhi Collection to place orders and track your purchases.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark" style="width:52px;height:52px;font-size:1.4rem;background:linear-gradient(135deg,#3B1F3F,#7A3455);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#C9A45C;margin:0 auto .75rem">✦</div>
      <h1 style="font-size:1.8rem;margin-bottom:.25rem">Yazhi Collection</h1>
      <p>Sign in to your account or create a new one</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div id="form-login">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div style="position:relative">
          <input type="password" id="login-password" placeholder="Your password" autocomplete="current-password" style="padding-right:2.5rem">
          <button onclick="togglePwd('login-password',this)" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;color:var(--muted);font-size:.9rem">👁</button>
        </div>
      </div>
      <div id="login-error" class="alert alert-warning" style="display:none"></div>
      <button class="btn btn-primary btn-full" onclick="doLogin()">Login →</button>
      <div class="divider-text">or</div>
      <a href="home.html" class="btn btn-ghost btn-full" style="text-align:center">Browse as Guest (no account needed)</a>
    </div>

    <!-- Register Form -->
    <div id="form-register" style="display:none">
      <div class="form-grid-2">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="reg-name" placeholder="Your full name">
        </div>
        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" id="reg-phone" placeholder="10-digit mobile" maxlength="10">
        </div>
      </div>
      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" id="reg-email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Password *</label>
        <div style="position:relative">
          <input type="password" id="reg-password" placeholder="Min 6 characters" style="padding-right:2.5rem">
          <button onclick="togglePwd('reg-password',this)" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;color:var(--muted);font-size:.9rem">👁</button>
        </div>
      </div>
      <div id="reg-error" class="alert alert-warning" style="display:none"></div>
      <div id="reg-success" class="alert alert-success" style="display:none"></div>
      <button class="btn btn-primary btn-full" onclick="doRegister()">Create Account →</button>
      <p style="font-size:.75rem;color:var(--muted);text-align:center;margin-top:.75rem">By creating an account you agree to receive order updates from Yazhi Collection.</p>
    </div>

    <div style="text-align:center;margin-top:1.5rem">
      <a href="owner-login.html" style="font-size:.78rem;color:var(--muted)">Owner Login →</a>
    </div>
  </div>
</div>

<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
// Redirect if already logged in
const existingSession = yazhiGetSession();
if (existingSession) {
  const redirect = new URLSearchParams(location.search).get('redirect') || 'home.html';
  window.location.href = redirect;
}

const redirectUrl = new URLSearchParams(location.search).get('redirect') || 'home.html';

function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('form-login').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
}

function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
}

function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  if (!email || !pass) { errEl.style.display=''; errEl.textContent='Please fill in all fields.'; return; }
  const result = yazhiLogin(email, pass);
  if (result.success) {
    yazhiToast(`Welcome back, ${result.session.name.split(' ')[0]}! 🎉`, 'success');
    setTimeout(() => { window.location.href = redirectUrl; }, 800);
  } else {
    errEl.style.display = '';
    errEl.textContent = result.error;
  }
}

function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-password').value;
  const errEl = document.getElementById('reg-error');
  const succEl = document.getElementById('reg-success');
  errEl.style.display = 'none';
  succEl.style.display = 'none';
  if (!name || !phone || !email || !pass) { errEl.style.display=''; errEl.textContent='Please fill all required fields.'; return; }
  if (pass.length < 6) { errEl.style.display=''; errEl.textContent='Password must be at least 6 characters.'; return; }
  if (!/^\d{10}$/.test(phone)) { errEl.style.display=''; errEl.textContent='Please enter a valid 10-digit phone number.'; return; }
  const result = yazhiRegister(name, email, phone, pass);
  if (result.success) {
    succEl.style.display = '';
    succEl.textContent = '✔ Account created! Redirecting...';
    setTimeout(() => { window.location.href = redirectUrl; }, 1000);
  } else {
    errEl.style.display = '';
    errEl.textContent = result.error;
  }
}

// Handle Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('form-login').style.display !== 'none') doLogin();
    else doRegister();
  }
});
</script>
</body>
</html>
