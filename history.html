<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History – Yazhi Collection</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="offer-banner"><span id="offer-ticker-text"></span></div>
<header class="yazhi-header">
  <div class="container header-inner">
    <a href="home.html" class="logo"><div class="logo-mark">✦</div><div><div class="logo-text">Yazhi Collection</div><div class="logo-sub">Luxury Boutique</div></div></a>
    <nav class="yazhi-nav">
      <a href="home.html">Home</a><a href="collections.html">Collections</a>
      <a href="new-arrivals.html">New Arrivals</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="btn-icon">🛍️<span data-cart-badge style="display:none"></span></a>
      <button class="btn-icon" onclick="yazhiLogout()">🚪</button>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>
<div class="nav-overlay" id="nav-overlay"></div>
<nav class="nav-drawer" id="nav-drawer">
  <div class="drawer-header"><div class="logo"><div class="logo-mark" style="width:32px;height:32px;font-size:.85rem">✦</div><div class="logo-text">Yazhi Collection</div></div><button class="drawer-close" id="drawer-close">✕</button></div>
  <div class="drawer-nav"><a href="home.html">🏠 Home</a><a href="profile.html">👤 Profile</a><a href="history.html" class="active">📋 Orders</a><a href="cart.html">🛍️ Cart</a></div>
</nav>

<div class="page-hero" style="padding:2.5rem 0 3rem">
  <div class="container">
    <div class="breadcrumb"><a href="home.html">Home</a><span>/</span><a href="profile.html">Profile</a><span>/</span><span>Orders</span></div>
    <h1>My Orders 📋</h1>
  </div>
</div>

<section style="padding-top:2rem">
  <div class="container">
    <div class="profile-layout">
      <div class="profile-sidebar">
        <div class="profile-avatar" id="profile-initials">Y</div>
        <p style="text-align:center;font-family:var(--serif);font-size:1.1rem;color:var(--plum);margin-bottom:.25rem" id="profile-name"></p>
        <div class="profile-nav">
          <a href="profile.html">👤 My Profile</a>
          <a href="history.html" class="active">📋 Order History</a>
          <a href="track-order.html">📍 Track Order</a>
          <a href="enquiry.html">💬 Enquiry</a>
          <div class="drawer-divider"></div>
          <button onclick="yazhiLogout()" style="width:100%;text-align:left;padding:.7rem 1rem;background:none;color:var(--danger);font-size:.88rem;font-weight:500;border-radius:var(--r-sm);cursor:pointer">🚪 Logout</button>
        </div>
      </div>

      <div>
        <div id="orders-list"></div>
      </div>
    </div>
  </div>
</section>

<footer class="yazhi-footer">
  <div class="container">
    <div class="footer-bottom"><p>© 2024 Yazhi Collection · Sharmila M · Coimbatore</p></div>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/app.js"></script>
<script>
const session = yazhiGetSession();
if (!session) { window.location.href = 'login.html'; }

const STATUS_LABELS = { placed:'Order Placed', confirmed:'Confirmed', processing:'Processing', packed:'Packed', shipped:'Shipped', out:'Out for Delivery', delivered:'Delivered', cancelled:'Cancelled' };

document.addEventListener('DOMContentLoaded', () => {
  const profile = yazhiGetFullProfile();
  if (profile) {
    const initials = (profile.name||'Y').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    document.getElementById('profile-initials').textContent = initials;
    document.getElementById('profile-name').textContent = profile.name || '';
  }

  const orders = yazhiGetUserOrders(session.id);
  const listEl = document.getElementById('orders-list');

  if (orders.length === 0) {
    listEl.innerHTML = `<div style="text-align:center;padding:4rem 2rem;color:var(--muted)">
      <div style="font-size:4rem;margin-bottom:1rem">📋</div>
      <h3 style="color:var(--plum);margin-bottom:.5rem">No orders yet</h3>
      <p style="margin-bottom:1.5rem">Your order history will appear here once you place your first order.</p>
      <a href="collections.html" class="btn btn-primary">Shop Now</a>
    </div>`;
    return;
  }

  listEl.innerHTML = orders.map(o => `
    <div class="history-card">
      <div class="history-card-header">
        <div>
          <div style="font-weight:700;color:var(--plum);font-size:.9rem">#${o.id}</div>
          <div style="font-size:.75rem;color:var(--muted);margin-top:.1rem">${new Date(o.createdAt).toLocaleDateString('en-IN',{dateStyle:'long'})}</div>
        </div>
        <span class="order-status-chip status-${o.status}">${STATUS_LABELS[o.status]||o.status}</span>
      </div>
      <div style="font-size:.85rem;color:var(--muted);margin-bottom:.75rem">
        ${o.items.map(i=>`${i.name} (×${i.qty})`).join(', ')}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem">
        <div>
          <span style="font-size:.78rem;color:var(--muted)">Payment: ${o.paymentMethod}</span>
          ${o.appliedOffer ? `<span style="font-size:.75rem;color:var(--ok);margin-left:.75rem">🎉 ${o.appliedOffer}</span>` : ''}
        </div>
        <strong style="color:var(--plum);font-size:1rem">₹${o.total.toLocaleString('en-IN')}</strong>
      </div>
      <div style="margin-top:.75rem;display:flex;gap:.5rem;flex-wrap:wrap">
        <a href="track-order.html?id=${o.id}" class="btn btn-primary btn-sm">Track Order</a>
        <a href="https://wa.me/916369685930?text=Hi%20I%20have%20a%20query%20about%20my%20order%20${o.id}" target="_blank" class="btn btn-whatsapp btn-sm">WhatsApp</a>
      </div>
    </div>`).join('');
});
</script>
</body>
</html>
