<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yazhi Collection – Luxury Women's Boutique, Coimbatore</title>
  <meta name="description" content="Yazhi Collection by Sharmila M – Premium women's boutique in Coimbatore. Bridal wear, sarees, ethnic, festive & custom design. Shop 9 AM to 9 PM.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{margin:0;overflow:hidden}
    .glance-wrap{position:fixed;inset:0;background:linear-gradient(135deg,#261129 0%,#3B1F3F 50%,#7A3455 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
    .glance-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .particle{position:absolute;border-radius:50%;animation:float linear infinite;opacity:.12}
    @keyframes float{0%{transform:translateY(100vh) rotate(0)}100%{transform:translateY(-100px) rotate(360deg)}}
    .ornament{font-size:1.4rem;color:rgba(201,164,92,.3);animation:shimmer 3s ease-in-out infinite;margin-bottom:1.5rem}
    @keyframes shimmer{0%,100%{opacity:.3}50%{opacity:.7}}
    .glance-logo-text{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(3rem,12vw,6.5rem);font-style:italic;color:#fff;line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.4);letter-spacing:-1px}
    .glance-logo-text em{font-style:normal;color:#C9A45C}
    .glance-sub{font-family:'Plus Jakarta Sans',sans-serif;font-size:clamp(.75rem,2vw,1rem);color:rgba(255,255,255,.55);letter-spacing:4px;text-transform:uppercase;margin:1rem 0 2.5rem}
    .glance-ring-wrap{position:relative;width:70px;height:70px;margin:0 auto 1.5rem}
    .glance-ring-wrap svg{transform:rotate(-90deg)}
    .ring-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:3}
    .ring-prog{fill:none;stroke:#C9A45C;stroke-width:3;stroke-linecap:round;stroke-dasharray:188;stroke-dashoffset:188;animation:ring 4s linear forwards}
    @keyframes ring{to{stroke-dashoffset:0}}
    .ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;font-size:1.1rem;font-weight:700;color:#C9A45C}
    .glance-skip-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.8);padding:.55rem 1.4rem;border-radius:9999px;font-size:.82rem;letter-spacing:.5px;cursor:pointer;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif}
    .glance-skip-btn:hover{background:rgba(255,255,255,.18);color:#fff}
    .glance-owner{position:absolute;bottom:2rem;color:rgba(255,255,255,.35);font-size:.72rem;letter-spacing:2px;text-transform:uppercase;font-family:'Plus Jakarta Sans',sans-serif}
    .glance-wrap.fade-out{opacity:0;transform:scale(1.04);transition:opacity .6s ease,transform .6s ease}
  </style>
</head>
<body>

<div class="glance-wrap" id="glance-screen">
  <!-- Floating particles -->
  <div class="glance-particles" id="particles"></div>

  <p class="ornament">✦ &nbsp; ✦ &nbsp; ✦</p>

  <h1 class="glance-logo-text">Yazhi <em>Collection</em></h1>
  <p class="glance-sub">Luxury Women's Boutique · Coimbatore</p>

  <div class="glance-ring-wrap">
    <svg width="70" height="70" viewBox="0 0 70 70">
      <circle class="ring-bg" cx="35" cy="35" r="30"/>
      <circle class="ring-prog" cx="35" cy="35" r="30"/>
    </svg>
    <div class="ring-num" id="glance-timer">4</div>
  </div>

  <button class="glance-skip-btn" id="glance-skip">Enter the Boutique →</button>

  <p class="glance-owner">By Sharmila M &nbsp;|&nbsp; Est. 2020</p>
</div>

<script>
// ─── Generate Particles ───────────────────────────────────────
(function(){
  const container = document.getElementById('particles');
  const colors = ['#C9A45C','#F3DDE3','#7A3455','#fff'];
  for(let i=0;i<22;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random()*20+6;
    p.style.cssText = `width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${Math.random()*100}%;animation-duration:${Math.random()*12+8}s;animation-delay:${Math.random()*8}s;`;
    container.appendChild(p);
  }
})();

// ─── Countdown + Redirect ─────────────────────────────────────
let countdown = 4;
const timerEl = document.getElementById('glance-timer');
const screen = document.getElementById('glance-screen');

const redirect = () => {
  screen.classList.add('fade-out');
  setTimeout(()=>{ window.location.href='home.html'; }, 600);
};

const tick = setInterval(()=>{
  countdown--;
  timerEl.textContent = countdown;
  if(countdown <= 0){ clearInterval(tick); redirect(); }
}, 1000);

document.getElementById('glance-skip').addEventListener('click',()=>{
  clearInterval(tick);
  redirect();
});
</script>
</body>
</html>
