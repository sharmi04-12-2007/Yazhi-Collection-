<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <!-- Elegant Yazhi Emblem: stylized 'Y' intertwined with subtle peacock feather / lotus petal arch in antique gold -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77D"/>
      <stop offset="45%" stop-color="#C9A45C"/>
      <stop offset="100%" stop-color="#9A752B"/>
    </linearGradient>
    <linearGradient id="plumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B1F3F"/>
      <stop offset="100%" stop-color="#5C223D"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#C9A45C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(6, 4)">
    <!-- Outer delicate ring / diamond motif -->
    <circle cx="28" cy="28" r="26" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3 1.5" opacity="0.6"/>
    <circle cx="28" cy="28" r="22" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4"/>
    
    <!-- Stylized Y / Lotus Paisley Center -->
    <path d="M28 8 C30 18 38 21 41 27 C43 32 39 39 33 41 C27 43 21 39 20 33 C19 28 23 23 28 19" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M28 8 C26 18 18 21 15 27 C13 32 17 39 23 41 C29 43 35 39 36 33 C37 28 33 23 28 19" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Central Stamen / Graceful Petal -->
    <path d="M28 16 L28 44 M24 44 L32 44" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="28" cy="14" r="2.2" fill="url(#goldGrad)"/>
    <circle cx="20" cy="22" r="1.2" fill="url(#goldGrad)"/>
    <circle cx="36" cy="22" r="1.2" fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Typography -->
  <!-- "YAZHI" -->
  <text x="70" y="34" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="25" font-weight="600" letter-spacing="3.5" fill="#3B1F3F">
    YAZHI
  </text>
  
  <!-- "COLLECTION" -->
  <text x="71" y="49" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="4.8" fill="#C9A45C">
    COLLECTION
  </text>

  <!-- Subtle divider dot & location -->
  <text x="180" y="48.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="400" letter-spacing="1.5" fill="#8B7B87">
    · BOUTIQUE
  </text>
</svg>
