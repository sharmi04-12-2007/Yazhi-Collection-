<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D152F"/>
      <stop offset="35%" stop-color="#3B1F3F"/>
      <stop offset="68%" stop-color="#552341"/>
      <stop offset="100%" stop-color="#7A3455"/>
    </linearGradient>

    <!-- Silk Sheen Gradient -->
    <linearGradient id="silkSheen" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#C9A45C" stop-opacity="0.16"/>
      <stop offset="30%" stop-color="#F3DDE3" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#C9A45C" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FAF1F3" stop-opacity="0.03"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#FBF5EC" stop-opacity="0"/>
      <stop offset="70%" stop-color="#1F0D22" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#140616" stop-opacity="0.65"/>
    </radialGradient>

    <pattern id="zariMotif" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M60 15 C72 38 98 48 98 60 C98 72 72 82 60 105 C48 82 22 72 22 60 C22 48 48 38 60 15 Z" 
            fill="none" stroke="#C9A45C" stroke-width="0.75" stroke-opacity="0.12"/>
      <circle cx="60" cy="60" r="3" fill="#C9A45C" fill-opacity="0.16"/>
      <circle cx="0" cy="0" r="1.5" fill="#C9A45C" fill-opacity="0.08"/>
      <circle cx="120" cy="0" r="1.5" fill="#C9A45C" fill-opacity="0.08"/>
      <circle cx="0" cy="120" r="1.5" fill="#C9A45C" fill-opacity="0.08"/>
      <circle cx="120" cy="120" r="1.5" fill="#C9A45C" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Base Color -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Flowing Silk Drapes -->
  <path d="M0 0 C450 160 850 40 1350 220 C1650 320 1820 180 1920 120 L1920 1080 L0 1080 Z" fill="url(#silkSheen)"/>
  <path d="M0 320 C500 500 950 280 1480 540 C1750 670 1850 590 1920 520 L1920 1080 L0 1080 Z" fill="#261129" fill-opacity="0.28"/>
  <path d="M0 640 C420 800 890 620 1420 860 C1700 980 1840 920 1920 870 L1920 1080 L0 1080 Z" fill="url(#silkSheen)" opacity="0.7"/>

  <!-- Subtle Zari Ornamental Layer -->
  <rect width="1920" height="1080" fill="url(#zariMotif)"/>

  <!-- Ambient Vignette -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
