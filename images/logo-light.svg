<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <!-- Elegant Yazhi Emblem for Dark Backgrounds -->
  <defs>
    <linearGradient id="goldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E1A6"/>
      <stop offset="50%" stop-color="#D9B76A"/>
      <stop offset="100%" stop-color="#B28C3C"/>
    </linearGradient>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(6, 4)">
    <circle cx="28" cy="28" r="26" stroke="url(#goldGradLight)" stroke-width="1.2" stroke-dasharray="3 1.5" opacity="0.7"/>
    <circle cx="28" cy="28" r="22" stroke="url(#goldGradLight)" stroke-width="0.8" opacity="0.4"/>
    
    <path d="M28 8 C30 18 38 21 41 27 C43 32 39 39 33 41 C27 43 21 39 20 33 C19 28 23 23 28 19" 
          fill="none" stroke="url(#goldGradLight)" stroke-width="2" stroke-linecap="round"/>
    <path d="M28 8 C26 18 18 21 15 27 C13 32 17 39 23 41 C29 43 35 39 36 33 C37 28 33 23 28 19" 
          fill="none" stroke="url(#goldGradLight)" stroke-width="2" stroke-linecap="round"/>
    <path d="M28 16 L28 44 M24 44 L32 44" stroke="url(#goldGradLight)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="28" cy="14" r="2.2" fill="url(#goldGradLight)"/>
    <circle cx="20" cy="22" r="1.2" fill="url(#goldGradLight)"/>
    <circle cx="36" cy="22" r="1.2" fill="url(#goldGradLight)"/>
  </g>

  <!-- Typography -->
  <text x="70" y="34" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="25" font-weight="600" letter-spacing="3.5" fill="#FFFFFF">
    YAZHI
  </text>
  
  <text x="71" y="49" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="4.8" fill="#D9B76A">
    COLLECTION
  </text>

  <text x="180" y="48.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="400" letter-spacing="1.5" fill="rgba(255,255,255,0.65)">
    · BOUTIQUE
  </text>
</svg>
